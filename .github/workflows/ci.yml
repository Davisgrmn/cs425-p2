name: Build and test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SANITIZERS: address,undefined
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install coverage tool
        if: matrix.compiler == 'gcc'
        run: python -m pip install gcovr
      - name: Build all configurations
        run: make all CC=${{ matrix.compiler }}
      - name: Protocol and I/O adapter unit tests
        run: make check CC=${{ matrix.compiler }}
      - name: Full application coverage threshold
        if: matrix.compiler == 'gcc'
        run: make report CC=gcc
      - name: Sanitizers
        run: make leak leak-test CC=${{ matrix.compiler }}
      - name: Local transfer and I/O edge tests
        run: make integration CC=${{ matrix.compiler }}
      - name: Retain reports and transfer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.compiler }}
          path: |
            build/report
            build/integration
          if-no-files-found: ignore
