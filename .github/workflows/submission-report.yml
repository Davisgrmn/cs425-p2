name: Create submission report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report tools
        run: |
          python -m pip install gcovr
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Validate and create report
        run: bash scripts/create-submission-report.sh
      - uses: actions/upload-artifact@v4
        with:
          name: submission-report
          path: |
            submission-report.md
            submission-report.docx
            build/report
